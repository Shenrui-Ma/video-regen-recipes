name: Template catalog

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/catalog.py'
      - 'scripts/ci_sync_catalog.sh'
      - 'tests/test_catalog.py'
      - 'tests/test_catalog_workflow.py'
      - 'README.md'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'scripts/catalog.py'
      - 'scripts/ci_sync_catalog.sh'
      - 'tests/test_catalog.py'
      - 'tests/test_catalog_workflow.py'
      - 'README.md'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/catalog.py check
      - run: python3 -m unittest discover -s tests -v

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Rebuild and publish from current main
        run: bash scripts/ci_sync_catalog.sh
